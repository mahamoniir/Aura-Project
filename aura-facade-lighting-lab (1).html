canvas{width:100%;height:100%;display:block;touch-action:none}
.tip{position:absolute;top:8px;inset-inline:8px;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:4px 10px;font-size:12px}
.hud{position:absolute;inset:auto 8px 8px 8px;display:flex;gap:6px;flex-wrap:wrap}
button,select,input[type=text],input[type=number]{font:500 13px 'IBM Plex Sans Arabic',Tahoma,sans-serif;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:6px;padding:5px 10px;cursor:pointer}

.rw{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0}

.mu{color:var(--mu);font-size:12px}textarea{width:100%;height:100px;direction:ltr;font:12px monospace;background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:6px}

sky('dusk');led();preset(PRE['مثل الرندر: LED تحت الألواح']);rs();

R.setAnimationLoop(()=>{sync();O.update();R.render(S,C)});
