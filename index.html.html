:root[data-theme="dark"]{--bg:#0d0e10;--bg2:#17181b;--tx:#f2f0ec;--mu:#999;--ln:#2e3035;--card:#1f2024}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 14px/1.6 'IBM Plex Sans Arabic',Tahoma,sans-serif}
.app{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:12px;padding:12px;max-width:1700px;margin:0 auto}
@media(max-width:900px){.app{grid-template-columns:minmax(0,1fr)}}
.st{position:sticky;top:0;align-self:start;z-index:2}
.cvw{position:relative;aspect-ratio:16/10;min-height:260px;max-height:90vh;border-radius:8px;overflow:hidden;background:#000}
canvas{width:100%;height:100%;display:block;touch-action:none}
.tip{position:absolute;top:8px;inset-inline:8px;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:4px 10px;font-size:12px}
.hud{position:absolute;inset:auto 8px 8px 8px;display:flex;gap:6px;flex-wrap:wrap}
button,select,input[type=text],input[type=number]{font:500 13px 'IBM Plex Sans Arabic',Tahoma,sans-serif;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:6px;padding:5px 10px;cursor:pointer}
button.on{border-color:var(--ac);color:var(--ac)}button.p{background:var(--ac);border-color:var(--ac);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
h1{font-size:17px;margin:0 0 8px}.pn{display:flex;flex-direction:column;gap:8px}
details{background:var(--bg2);border:1px solid var(--ln);border-radius:8px;padding:8px 12px}summary{font-weight:700;cursor:pointer}
.rw{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0}
.sl{display:grid;grid-template-columns:1fr auto;margin:5px 0;color:var(--tx)}.sl input{grid-column:1/3;width:100%;accent-color:var(--ac)}.sl b{font-weight:500;color:var(--mu);direction:ltr}
input[type=color]{width:38px;height:28px;padding:0;border:1px solid var(--ln);border-radius:6px;background:none}
.mu{color:var(--mu);font-size:12px}textarea{width:100%;height:100px;direction:ltr;font:12px monospace;background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:6px}
.mt{border-top:1px solid var(--ln);margin-top:8px;padding-top:6px}
.hud button{opacity:.95}.sw{display:inline-block;width:14px;height:14px;border:1px solid #888;border-radius:50%;vertical-align:middle}
</style></head><body>
